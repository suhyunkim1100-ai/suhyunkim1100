<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두더지 잡기</title>
<style>
  /* ===== 여기는 "꾸미기" 부분이에요 (색, 크기, 움직임) ===== */
  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
    background: #8cc152;
    color: #3b2a1a;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  main { width: 100%; max-width: 460px; text-align: center; }
  h1 { margin: 0 0 16px; font-size: 32px; }

  /* 점수판 */
  .board { display: flex; gap: 8px; margin-bottom: 16px; }
  .board div {
    flex: 1;
    padding: 8px 4px;
    background: #fff8e7;
    border-radius: 12px;
    font-size: 14px;
  }
  .board b { display: block; font-size: 26px; }

  /* 구멍 9개를 3줄로 놓기 */
  .field {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  /* 구멍 하나 */
  .hole {
    position: relative;
    aspect-ratio: 1;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    touch-action: manipulation;
  }
  .hole::before {
    content: "";
    position: absolute;
    left: 6%; right: 6%; bottom: 6%;
    height: 36%;
    background: #4a3322;
    border-radius: 50%;
  }

  /* 두더지가 구멍 아래로 숨을 수 있게 가려 주는 칸 */
  .cover {
    position: absolute;
    left: 0; right: 0; top: 0; bottom: 24%;
    overflow: hidden;
  }

  /* 두더지 */
  .mole {
    position: absolute;
    left: 22%; right: 22%; bottom: 0;
    height: 72%;
    background: var(--mole-color, #9b6a43);
    border-radius: 50% 50% 12% 12%;
    transform: translateY(105%);
    transition: transform 0.12s ease-out;
  }
  .hole.up .mole { transform: translateY(0); }

  /* 눈 2개 */
  .mole::before {
    content: "";
    position: absolute;
    top: 24%; left: 20%;
    width: 60%;
    height: 14%;
    background:
      radial-gradient(closest-side, #1f1209 90%, transparent) left center / 25% 100% no-repeat,
      radial-gradient(closest-side, #1f1209 90%, transparent) right center / 25% 100% no-repeat;
  }
  /* 코 */
  .mole::after {
    content: "";
    position: absolute;
    top: 42%; left: 39%;
    width: 22%;
    height: 13%;
    background: #f29fa8;
    border-radius: 50%;
  }

  /* 맞았을 때 */
  .hole.hit .mole { background: #ffffff; }

  /* 시작 버튼 */
  #start {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    background: #3b2a1a;
    color: #fff;
    font: inherit;
    font-size: 20px;
    font-weight: bold;
    cursor: pointer;
  }
  #start:disabled { opacity: 0.5; cursor: default; }

  #message { min-height: 24px; margin: 0 0 12px; font-weight: bold; }
</style>
</head>
<body>
<main>
  <h1>🔨 두더지 잡기</h1>

  <div class="board">
    <div>점수<b id="score">0</b></div>
    <div>남은 시간<b id="time">30</b></div>
    <div>최고 점수<b id="best">0</b></div>
  </div>

  <p id="message">시작 버튼을 눌러 주세요!</p>

  <div class="field" id="field"></div>

  <button id="start">게임 시작</button>
</main>

<script>
  // ===== 여기는 "게임 규칙" 부분이에요 =====

  // 바꿔 보기 좋은 숫자들
  const GAME_SECONDS = 30;   // 게임 시간 (초)
  const SLOWEST = 1000;      // 처음에 두더지가 머무는 시간 (1000 = 1초)
  const FASTEST = 450;       // 마지막에 두더지가 머무는 시간
  const BONUS_AFTER = 15;    // 몇 초가 지나면 점수가 2배가 될지
  const COLORS = ["#9b6a43", "#f0b429", "#5bb5e8", "#a77bd9", "#f08c3a", "#ece3d0"]; // 두더지 색깔들
  const RED_COLOR = "#d92b2b"; // 빨간 두더지 색깔
  const RED_SCORE = 4;         // 빨간 두더지를 잡으면 얻는 점수

  // 화면에 있는 것들을 가져와요
  const field = document.getElementById("field");
  const scoreText = document.getElementById("score");
  const timeText = document.getElementById("time");
  const bestText = document.getElementById("best");
  const message = document.getElementById("message");
  const startButton = document.getElementById("start");

  // 게임이 기억해야 할 것들
  let score = 0;
  let timeLeft = GAME_SECONDS;
  let playing = false;
  let currentHole = null;  // 지금 두더지가 나와 있는 구멍
  let lastHole = null;     // 바로 전에 나왔던 구멍
  let isRed = false;       // 지금 나온 두더지가 빨간색인지
  let redTimes = [];       // 빨간 두더지가 나올 때 (남은 시간 기준)
  let clockTimer = null;
  let moleTimer = null;
  let best = loadBest();

  bestText.textContent = best;

  // 구멍 9개 만들기
  const holes = [];
  for (let i = 0; i < 9; i++) {
    const hole = document.createElement("button");
    hole.className = "hole";
    hole.setAttribute("aria-label", "구멍 " + (i + 1));
    hole.innerHTML = '<span class="cover"><span class="mole"></span></span>';
    hole.addEventListener("pointerdown", () => hitHole(hole));
    field.appendChild(hole);
    holes.push(hole);
  }

  startButton.addEventListener("click", startGame);

  // 게임 시작
  function startGame() {
    score = 0;
    timeLeft = GAME_SECONDS;
    playing = true;
    lastHole = null;
    planRedMoles();
    scoreText.textContent = score;
    timeText.textContent = timeLeft;
    message.textContent = "잡아라!";
    startButton.disabled = true;

    clockTimer = setInterval(tick, 1000);
    showMole();
  }

  // 빨간 두더지 2마리가 나올 때를 미리 정해요
  // 한 마리는 보너스 시간 앞쪽에, 한 마리는 뒤쪽에 나와요
  function planRedMoles() {
    const bonusSeconds = GAME_SECONDS - BONUS_AFTER;
    redTimes = [
      bonusSeconds * (0.6 + Math.random() * 0.3),
      bonusSeconds * (0.2 + Math.random() * 0.3),
    ];
  }

  // 1초마다 시간을 줄여요
  function tick() {
    timeLeft--;
    timeText.textContent = timeLeft;
    if (timeLeft === GAME_SECONDS - BONUS_AFTER) {
      message.textContent = "🔥 지금부터 점수 2배!";
    }
    if (timeLeft <= 0) endGame();
  }

  // 정해진 시간이 지났는지 확인해요
  function isBonusTime() {
    return GAME_SECONDS - timeLeft >= BONUS_AFTER;
  }

  // 두더지 한 마리 내보내기
  function showMole() {
    if (!playing) return;

    // 같은 구멍에 연달아 나오지 않게 다시 뽑아요
    let hole;
    do {
      hole = holes[Math.floor(Math.random() * holes.length)];
    } while (hole === lastHole);

    lastHole = hole;
    currentHole = hole;

    // 빨간 두더지가 나올 때가 됐는지 확인해요
    isRed = redTimes.length > 0 && timeLeft <= redTimes[0];
    if (isRed) redTimes.shift();

    // 빨간 두더지가 아니면 색깔을 하나 뽑아서 칠해요
    const color = isRed ? RED_COLOR : COLORS[Math.floor(Math.random() * COLORS.length)];
    hole.style.setProperty("--mole-color", color);

    hole.classList.add("up");

    // 정해진 시간이 지나면 숨어요
    moleTimer = setTimeout(() => {
      hole.classList.remove("up");
      currentHole = null;
      moleTimer = setTimeout(showMole, 200);
    }, isRed ? stayTime() / 2 : stayTime()); // 빨간 두더지는 2배 빨리 숨어요
  }

  // 시간이 지날수록 두더지가 빨리 숨어요
  function stayTime() {
    const passed = (GAME_SECONDS - timeLeft) / GAME_SECONDS;
    return SLOWEST - (SLOWEST - FASTEST) * passed;
  }

  // 구멍을 눌렀을 때
  function hitHole(hole) {
    if (!playing || hole !== currentHole) return;

    if (isRed) {
      score += RED_SCORE;
    } else {
      score += isBonusTime() ? 2 : 1;
    }
    scoreText.textContent = score;

    clearTimeout(moleTimer);
    currentHole = null;

    // 잠깐 빨개졌다가 숨어요
    hole.classList.add("hit");
    setTimeout(() => hole.classList.remove("up", "hit"), 150);

    moleTimer = setTimeout(showMole, 300);
  }

  // 게임 끝
  function endGame() {
    playing = false;
    clearInterval(clockTimer);
    clearTimeout(moleTimer);
    holes.forEach((hole) => hole.classList.remove("up", "hit"));
    currentHole = null;

    if (score > best) {
      best = score;
      bestText.textContent = best;
      saveBest(best);
      message.textContent = "새 기록! " + score + "점이에요 🎉";
    } else {
      message.textContent = "끝! " + score + "점이에요";
    }

    startButton.disabled = false;
    startButton.textContent = "다시 하기";
  }

  // 최고 점수를 브라우저에 저장하고 불러와요
  function loadBest() {
    try {
      return Number(localStorage.getItem("moleBest")) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem("moleBest", value);
    } catch (e) {
      // 저장이 안 되는 환경이면 그냥 넘어가요
    }
  }
</script>
</body>
</html>
